name: "🐛 Bug Report"
description: "Сообщить об ошибке или неожиданном поведении"
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение об ошибке! Заполните форму ниже.

  - type: textarea
    id: description
    attributes:
      label: "📝 Описание бага"
      description: "Что произошло? Что ожидалось?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Шаги для воспроизведения"
      description: "Как повторить баг?"
      placeholder: |
        1. Запустить тест X
        2. Вызвать метод Y
        3. Увидеть ошибку Z
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Ожидаемое поведение"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Фактическое поведение"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "🖥️ Окружение"
      description: "Версия Java, ОС, версия библиотеки."
    validations:
      required: false